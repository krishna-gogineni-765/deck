[project]
name = "deck"
version = "0.1.0"
description = "deck: zero-shot classification. deck4b is the decision model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
serve = [
    "torch==2.11.0",
    "transformers==5.17.0",
    "peft==0.21.0",
    "torchao==0.18.0",
    "accelerate==1.15.0",
    "huggingface-hub==1.32.0",
    "safetensors==0.8.0",
    "numpy==2.5.3",
    "einops==0.8.2",
    "fla-core==0.4.2",
    "flash-linear-attention==0.4.2",
    "jevk5 @ git+https://github.com/allebee/jevk5.git@f944fe37ff1d5ed3830aa4c8d88b7189c8c1268a",
]

[project.scripts]
deck = "deck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
